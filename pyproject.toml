[project]
name = "deepfusion-ddg"
version = "0.1.0"
description = "Deep learning models for protein stability prediction via delta-delta-G (ΔΔG) estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "biopython>=1.81",
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "networkx>=3.1",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
]
